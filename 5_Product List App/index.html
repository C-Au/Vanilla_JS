<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product List App</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>

  <body>
    <div class="container">
      <label for="inputField">New Products to be added:</label>
      <form id="nameForm">
        <input
          type="text"
          id="nameField"
          size="50"
          placeholder="Enter product name"
        />
        <input
          type="number"
          id="numberField"
          size="50"
          placeholder="Enter price"
        />
        <button type="submit" id="submitButton">Add Item</button>
      </form>
      <ul id="listInput" class="items-list"></ul>
      <button type="button" id="filterButton">Filter products on price</button>
    </div>
  </body>
</html>
