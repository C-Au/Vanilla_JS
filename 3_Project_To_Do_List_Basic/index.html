<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basic To Do List</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
